[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moocleus-genomics"
version = "0.2.0"
description = "Bovine genomic data engineering pipeline for the 1000 Bull Genomes Project"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
linux = ["cyvcf2>=0.31"]
windows = ["scikit-allel>=1.3"]
app = ["streamlit>=1.40", "plotly>=5.24", "scipy>=1.14"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
moocleus = "moocleus.cli:main"

[tool.setuptools.packages.find]
include = ["moocleus*"]
